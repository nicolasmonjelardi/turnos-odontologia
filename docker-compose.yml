services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-turnos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turnos}
      POSTGRES_DB: ${POSTGRES_DB:-turnos}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-turnos}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-turnos}:${POSTGRES_PASSWORD:-turnos}@db:5432/${POSTGRES_DB:-turnos}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dummy-stub-c03}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "8000:8000"

volumes:
  pgdata:
